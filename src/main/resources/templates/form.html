<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Cadastro de Pessoa</title>
  <link rel="stylesheet" href="/styles/styles.css">
</head>
<body>

  <header>
    <h1 th:text="${pessoa.id != null ? 'Editar Pessoa' : 'Cadastrar Nova Pessoa'}"></h1>
  </header>

  <main>
    <form th:action="@{/pessoas}" th:object="${pessoa}" method="post" class="form-pessoa">

      <input type="hidden" th:field="*{id}"/>

      <label for="nome">Nome:</label>
        <input type="text" id="nome" name="nome" placeholder="Ex: João Silva" required>

        <label for="cpf">CPF:</label>
        <input type="text" id="cpf" name="cpf" placeholder="Ex: 123.456.789-00" required>

        <label for="endereco">Endereço:</label>
        <input type="text" id="endereco" name="endereco" placeholder="Ex: Rua das Flores, 123" required>

      <div class="buttons">
        <button type="submit" class="btn salvar">Salvar</button>
        <a href="/pessoas" class="btn voltar">Voltar</a>
      </div>
    </form>
  </main>

  <footer>
    <p>Projeto Wireframe Pessoa © 2025</p>
  </footer>

</body>
</html>
