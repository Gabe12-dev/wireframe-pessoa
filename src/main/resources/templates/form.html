<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Cadastro de Pessoa</title>
  <link rel="stylesheet" th:href="@{/styles/styles.css}">
</head>
<body>

<header>
  <h1 th:text="${pessoa.id != null ? 'Editar Pessoa' : 'Cadastrar Nova Pessoa'}"></h1>
</header>

<main>
  <form th:action="@{/pessoas}" th:object="${pessoa}" method="post" class="form-pessoa">

    <input type="hidden" th:field="*{id}"/>

    <label for="nome">Nome:</label>
    <input type="text" id="nome" th:field="*{nome}" placeholder="Ex: João Silva" required>


    <label for="cpf">CPF:</label>
    <input type="text" id="cpf" name="cpf" placeholder="000.000.000-00" maxlength="14" required>


    <label for="endereco">Endereço:</label>
    <input type="text" th:field="*{endereco}" placeholder="Ex: Rua das Flores, 123" required>

    <div class="buttons">
      <button type="submit" class="btn salvar">Salvar</button>
      <a th:href="@{/pessoas}" class="btn voltar">Voltar</a>
    </div>
  </form>
</main>

<footer>
  <p>Projeto Wireframe Pessoa © 2025</p>
</footer>

<script>
const cpfInput = document.getElementById("cpf");

cpfInput.addEventListener("input", function(e) {
    let value = cpfInput.value;

    // Remove qualquer caractere que não seja número
    value = value.replace(/\D/g, "");

    // Aplica a máscara: 000.000.000-00
    if (value.length > 3 && value.length <= 6) {
        value = value.replace(/(\d{3})(\d+)/, "$1.$2");
    } else if (value.length > 6 && value.length <= 9) {
        value = value.replace(/(\d{3})(\d{3})(\d+)/, "$1.$2.$3");
    } else if (value.length > 9) {
        value = value.replace(/(\d{3})(\d{3})(\d{3})(\d+)/, "$1.$2.$3-$4");
    }

    cpfInput.value = value;
});
</script>

<script>
const nomeInput = document.getElementById("nome");

nomeInput.addEventListener("input", function(e) {
    // Remove números e caracteres especiais, permite apenas letras e espaços
    let value = nomeInput.value;
    value = value.replace(/[^a-zA-ZÀ-ÿ\s]/g, "");
    nomeInput.value = value;
});
</script>


</body>
</html>
