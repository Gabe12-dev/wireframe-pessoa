<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Buscar Pessoa</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<header>
    <h1>Buscar Pessoa</h1>
</header>

<main>

    <h2>Digite o Nome para Buscar</h2>

    <form action="/pessoas/buscar" method="get" class="search-form">
        <input type="text" name="nome" placeholder="Nome da pessoa" required>
        <button type="submit" class="btn btn-buscar">Buscar</button>
    </form>

    <!-- Se existir a variável 'pessoa', mostrar os dados -->
    <div th:if="${pessoa != null}" class="painel">

        <h2>Resultado</h2>

        <p><strong>ID:</strong> <span th:text="${pessoa.id}"></span></p>
        <p><strong>Nome:</strong> <span th:text="${pessoa.nome}"></span></p>

        <div class="painel-acoes">
            <a th:href="@{/pessoas/editar/{id}(id=${pessoa.id})}" class="btn editar">Editar</a>
            <a th:href="@{/pessoas/excluir/{id}(id=${pessoa.id})}" class="btn excluir"
               onclick="return confirm('Tem certeza que deseja excluir?')">
                Excluir
            </a>

            <!-- Botão VOLTAR -->
            <a href="/pessoas" class="btn voltar">Voltar</a>
        </div>

    </div>

    <!-- Se NÃO achar ninguém -->
    <div th:if="${mensagem != null}" class="painel">
        <h2 th:text="${mensagem}"></h2>

        <!-- Botão voltar também quando não encontrar -->
        <a href="/pessoas" class="btn voltar">Voltar</a>
    </div>

</main>

<footer>
    <p>Wireframe Pessoa - Todos os direitos reservados</p>
</footer>

</body>
</html>
