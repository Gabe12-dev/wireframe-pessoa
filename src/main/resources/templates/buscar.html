<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Buscar Pessoa</title>
    <link rel="stylesheet" th:href="@{/styles/styles.css}">
</head>
<body>

<header>
    <h1>Buscar Pessoa</h1>
</header>

<main>

    <h2>Digite o CPF para Buscar</h2>

    <form th:action="@{/pessoas/buscar/resultado}" method="get" class="search-form">
        <input type="text" name="cpf" id="cpf" placeholder="000.000.000-00" maxlength="14" required>
        <button type="submit" class="btn btn-buscar">Buscar</button>
    </form>

    <p id="msgErroCPF" class="msg-erro-cpf"></p>

</main>

<footer>
    <a th:href="@{/pessoas}" class="btn voltar">Voltar à lista</a>
</footer>

<script>
  document.querySelector(".search-form").addEventListener("submit", function(e) {
    const cpf = document.querySelector("input[name='cpf']").value.trim();
    if (cpf === "") {
      e.preventDefault();
      const msg = document.getElementById("msgErroCPF");
      msg.style.display = "block";
      msg.textContent = "Você deve digitar um CPF para buscar.";
    }
  });
</script>

<script>
const cpfInput = document.getElementById("cpf");

cpfInput.addEventListener("input", function(e) {
    let value = cpfInput.value;

    // Remove qualquer caractere que não seja número
    value = value.replace(/\D/g, "");

    // Aplica a máscara: 000.000.000-00
    if (value.length > 3 && value.length <= 6) {
        value = value.replace(/(\d{3})(\d+)/, "$1.$2");
    } else if (value.length > 6 && value.length <= 9) {
        value = value.replace(/(\d{3})(\d{3})(\d+)/, "$1.$2.$3");
    } else if (value.length > 9) {
        value = value.replace(/(\d{3})(\d{3})(\d{3})(\d+)/, "$1.$2.$3-$4");
    }

    cpfInput.value = value;
});
</script>


</body>
</html>
