<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <title>Listar Pessoas</title>
  <link rel="stylesheet" href="/styles/styles.css" />
</head>
<body>
  <h1>Lista de Pessoas</h1>
  <button onclick="listar()">Atualizar Lista</button>
  <ul id="lista"></ul>

  <script>
    function listar() {
      fetch("")
        .then(resp => resp.json())
        .then(pessoas => {
          const ul = document.getElementById("lista");
          ul.innerHTML = pessoas.map(p =>
            `<li>${p.id} - ${p.nome}</li>`
          ).join("");
        })
        .catch(() => alert("Erro ao buscar pessoas."));
    }
    listar(); // Chama automaticamente ao abrir
  </script>
</body>
</html>
